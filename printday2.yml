# Site name
site_name: Module 6 - Data Operations
dev_addr: '0.0.0.0:8000'

# Navigation menu
nav:
  - "Day 2 - Incident Response":
    - "Setup VM and MS Fabric Playground": labs/run-inside-vm.md
    - "Lab 2.1 ~ Ingest Data Pipeline": day2/21-ingest-pipeline.md
    - "Lab 2.2 ~ Notebook Breaks Pipeline": day2/22-notebook-breaks.md
    - "Lab 2.3 ~ Bad Data Received": day2/23-bad-data.md
    - "Lab 2.4 ~ Schema Breaks the Pipeline": day2/24-broken-schema.md
    - "Lab 2.5 ~ Run Concurrent Pipelines": day2/25-concurrent-runs.md
    - "Lab ~ 11 Data Activator": labs/11-data-activator.md
    - "Fire Drill Preparation": day2/incident-response-prep.md

# Theme
theme:
    name: material

# Extensions
markdown_extensions:
  - admonition
  - attr_list
  - codehilite:
      guess_lang: false
  - def_list
  - footnotes
  - meta
  - tables
  - toc:
      permalink: false
      toc_depth: 2

  - pymdownx.arithmatex
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: squidfunk
      repo: mkdocs-material
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.tilde

plugins:
  - print-site:
      enumerate_headings: false
      add_table_of_contents: false

