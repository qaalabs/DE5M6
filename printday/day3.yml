# Site name
site_name: Module 6 - Data Operations
use_directory_urls: false
dev_addr: '0.0.0.0:8000'

# Navigation menu
nav:
  - "Day 3 ~ Quality & Governance":
    - "👥 Data quality dimensions": day3/quality-dimensions.md
    - "Setup MS Fabric playground": labs/run-inside-vm.md
    - "Lab 3.1 - Medallion architecture": labs/31-medallion.md
    - "Lab 3.2 - 21 Deployment pipelines": labs/21-deployment-pipelines.md
    - "Bikezelo walkthrough": https://github.com/ingwaneorg/bikezelo
    - "Lab 3.3 - Clone, setup & run Bikezelo": day3/bikezelo-activity.md
    - "Lab 3.4 ~ Uncomment the rules": day3/bikezelo-rules.md
    - "Lab 3.5 ~ How does bikezelo forecast?": day3/bikezelo-forecast.md
    - "Data quality tools": day3/quality-tools.md

# Theme
theme:
    name: material

# Extensions
markdown_extensions:
  - admonition
  - attr_list
  - codehilite:
      guess_lang: false
  - def_list
  - footnotes
  - meta
  - tables
  - toc:
      permalink: false
      toc_depth: 2

  - pymdownx.arithmatex
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: squidfunk
      repo: mkdocs-material
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.tilde

plugins:
  - print-site:
      enumerate_headings: false
      add_table_of_contents: false
      add_cover_page: true
      cover_page_template: printday_cover.tpl

